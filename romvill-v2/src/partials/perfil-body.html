<!-- Cuerpo común de las cinco páginas de perfil de dimensión.
     La página pasa por cabecera:
       dim (seg|dem|san|mov|pro) · icon · num · photo · credito

     REDISEÑO (ver ANALISIS-DISENO.md §3.3): la versión anterior abría con un
     panel de barras cuyos valores estaban inventados. Decoración que finge
     dato es justo lo contrario de lo que predica la marca, así que se retira
     y su sitio lo ocupa una fotografía real del territorio, con su autoría y
     su licencia declaradas. -->

<section class="phero phero--photo on-dark grain">
  <picture class="phero__media" aria-hidden="true">
    <source media="(max-width: 700px)" srcset="assets/images/sec/{{@photo}}-sm.webp" type="image/webp">
    <source srcset="assets/images/sec/{{@photo}}.webp" type="image/webp">
    <img src="assets/images/sec/{{@photo}}.jpg" alt="" width="1600" height="900"
         fetchpriority="high" decoding="async" data-parallax="0.06">
  </picture>
  <span class="phero__veil" aria-hidden="true"></span>

  <div class="container phero__over">
    <a class="backlink" href="analisis.html" data-reveal="veil">
      <svg aria-hidden="true" style="transform:rotate(180deg)"><use href="assets/icons/sprite.svg#arrow-right"></use></svg>
      <span data-t="perfil.volver"></span>
    </a>

    <div class="phero__inner">
      <p class="kicker" data-reveal="veil">
        <span data-t="ana.dim"></span>
        <span class="num-tab" style="margin-left:8px">{{@num}}</span>
      </p>
      <h1 class="d-1" data-reveal="wipe" style="--reveal-delay:40ms" data-t="perfil.{{@dim}}.h1"></h1>
      <p class="lead" data-reveal="rise" style="--reveal-delay:100ms" data-t="perfil.{{@dim}}.intro"></p>
    </div>

  </div>
</section>

<!-- Las cuatro facetas de la dimensión -->
<section class="section" aria-labelledby="pf-h">
  <div class="container">
    <div class="sec-head" data-reveal="rise">
      <p class="kicker" data-t="ana.dim"></p>
      <h2 class="d-3" id="pf-h" data-t="perfil.{{@dim}}.h1"></h2>
    </div>

    <div class="pcards" data-stagger="80">
      <article class="pcard" data-reveal="rise">
        <span class="pcard__n num-tab">01</span>
        <div>
          <h3 class="d-6" data-t="perfil.{{@dim}}.c1.title"></h3>
          <p class="body-sm" data-t="perfil.{{@dim}}.c1.desc"></p>
        </div>
      </article>
      <article class="pcard" data-reveal="rise">
        <span class="pcard__n num-tab">02</span>
        <div>
          <h3 class="d-6" data-t="perfil.{{@dim}}.c2.title"></h3>
          <p class="body-sm" data-t="perfil.{{@dim}}.c2.desc"></p>
        </div>
      </article>
      <article class="pcard" data-reveal="rise">
        <span class="pcard__n num-tab">03</span>
        <div>
          <h3 class="d-6" data-t="perfil.{{@dim}}.c3.title"></h3>
          <p class="body-sm" data-t="perfil.{{@dim}}.c3.desc"></p>
        </div>
      </article>
      <article class="pcard" data-reveal="rise">
        <span class="pcard__n num-tab">04</span>
        <div>
          <h3 class="d-6" data-t="perfil.{{@dim}}.c4.title"></h3>
          <p class="body-sm" data-t="perfil.{{@dim}}.c4.desc"></p>
        </div>
      </article>
    </div>
  </div>
</section>

<!-- Otras dimensiones -->
<section class="section section--alt" aria-labelledby="rel-h">
  <div class="container">
    <div class="sec-head" data-reveal="rise">
      <p class="kicker" data-t="related.kicker"></p>
      <h2 class="d-3" id="rel-h" data-t="related.title"></h2>
    </div>
    {{> perfil-related}}
  </div>
</section>
