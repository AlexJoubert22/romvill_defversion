<!-- ══════════════════════════════════════════════════════════════════════
     DÓNDE OPERAMOS — pieza infográfica

     Rediseñada: antes eran tres tarjetas de foto y poco más. Ahora abre con
     un eje esquemático de la costa mediterránea a ESCALA REAL de distancia
     (Alicante → Málaga ≈ 480 km, Málaga → Marbella ≈ 57 km), que es
     exactamente por lo que los dos últimos nodos aparecen tan juntos: lo
     están. La línea se traza al entrar y los nodos se encienden en cascada.

     Las distancias y las coordenadas son datos geográficos, no copy: el
     texto de Romvill sigue saliendo íntegro del diccionario.
     ═════════════════════════════════════════════════════════════════════ -->

<section class="section-lg cobertura" aria-labelledby="cover-h">
  <div class="container-wide">

    <div class="sec-head" data-reveal="rise">
      <p class="kicker" data-t="sec.cover.badge"></p>
      <h2 class="d-2" id="cover-h" data-t="sec.cover.title"></h2>
      <p class="lead" data-t="sec.cover.desc"></p>
    </div>

    <!-- ── Ejes ────────────────────────────────────────────────────────────
         Tercer intento de esta pieza, y el que se queda. Los dos anteriores
         eran dibujo: una linea de 2 px sobre papel blanco (se leia como un
         hueco) y, despues, un panel de tinta con mar, anillos y marcas de
         escala (demasiado aparato para lo que dice). El dato es simple —tres
         ciudades, dos distancias— y no necesita mapa: necesita composicion.

         Tres columnas separadas por filete, con la distancia real colgada
         del propio filete. Cero SVG, cero animacion, cero relleno. -->
    <div class="ejes" data-stagger="90">
      <div class="eje" data-reveal="rise">
        <span class="eje__n num-tab">01</span>
        <span class="eje__nombre">Alicante</span>
        <span class="eje__zona" data-t="sec.alicante.sub"></span>
        <span class="eje__geo num-tab">38.35&#176; N &#183; 0.48&#176; O</span>
      </div>

      <span class="eje__salto" aria-hidden="true"><span class="num-tab">&#8776; 480 km</span></span>

      <div class="eje" data-reveal="rise">
        <span class="eje__n num-tab">02</span>
        <span class="eje__nombre">M&#225;laga</span>
        <span class="eje__zona" data-t="sec.malaga.sub"></span>
        <span class="eje__geo num-tab">36.72&#176; N &#183; 4.42&#176; O</span>
      </div>

      <span class="eje__salto" aria-hidden="true"><span class="num-tab">&#8776; 57 km</span></span>

      <div class="eje" data-reveal="rise">
        <span class="eje__n num-tab">03</span>
        <span class="eje__nombre">Marbella</span>
        <span class="eje__zona" data-t="sec.marbella.sub"></span>
        <span class="eje__geo num-tab">36.51&#176; N &#183; 4.89&#176; O</span>
      </div>
    </div>

        <circle cx="100" cy="100" r="88"/>
