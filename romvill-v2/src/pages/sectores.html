<!-- ══════════════════════════════════════════════════════════════════════
     SPLIT B2C / B2B — dos públicos, una pantalla. Al pasar el cursor cada
     mitad reclama espacio, como en el original, pero sin saltos bruscos.
     ═════════════════════════════════════════════════════════════════════ -->
<section class="split on-dark" aria-label="{{t sec.spec.title}}">

  <article class="split__half" data-half="b2c">
    <picture>
      <source media="(max-width: 900px)" srcset="assets/images/sec/costa-residencial-sm.webp" type="image/webp">
      <source srcset="assets/images/sec/costa-residencial.webp" type="image/webp">
      <img class="split__img" src="assets/images/sec/costa-residencial.jpg" alt="" width="1600" height="1066" fetchpriority="high" decoding="async">
    </picture>
    <span class="split__scrim" aria-hidden="true"></span>
    <div class="split__body">
      <p class="kicker" data-reveal="veil" data-t="sec.res.badge"></p>
      <h1 class="d-2" data-reveal="rise" data-t-html="sec.b2c.title"></h1>
      <p class="split__desc" data-reveal="rise" style="--reveal-delay:50ms" data-t="sec.b2c.desc"></p>
      <a class="btn btn--primary" href="#particulares" data-reveal="rise" style="--reveal-delay:100ms">
        <span data-t="sec.b2c.btn"></span>
        <svg aria-hidden="true"><use href="assets/icons/sprite.svg#arrow-down"></use></svg>
      </a>
    </div>
  </article>

  <article class="split__half" data-half="b2b">
    <picture>
      <source media="(max-width: 900px)" srcset="assets/images/sec/malaga-urbana-sm.webp" type="image/webp">
      <source srcset="assets/images/sec/malaga-urbana.webp" type="image/webp">
      <img class="split__img" src="assets/images/sec/malaga-urbana.jpg" alt="" width="1600" height="1066" fetchpriority="high" decoding="async">
    </picture>
    <span class="split__scrim" aria-hidden="true"></span>
    <div class="split__body">
      <p class="kicker" data-reveal="veil" data-t="sec.inv.badge"></p>
      <h2 class="d-2" data-reveal="rise" data-t-html="sec.b2b.title"></h2>
      <p class="split__desc" data-reveal="rise" style="--reveal-delay:50ms" data-t="sec.b2b.desc"></p>
      <a class="btn btn--outline" href="#inversores" data-reveal="rise" style="--reveal-delay:100ms">
        <span data-t="sec.inv.link"></span>
        <svg aria-hidden="true"><use href="assets/icons/sprite.svg#arrow-down"></use></svg>
      </a>
    </div>
  </article>
</section>

{{> cobertura}}

<!-- ══ SERVICIOS ESPECIALIZADOS ══════════════════════════════════════════ -->
<section class="section-lg section--alt" aria-labelledby="spec-h">
  <div class="container">
    <div class="sec-head sec-head--center" data-reveal="rise">
      <p class="kicker kicker--center" data-t="sec.spec.badge"></p>
      <h2 class="d-2" id="spec-h" data-t="sec.spec.title"></h2>
      <p class="lead" data-t="sec.spec.desc"></p>
    </div>
  </div>

  <!-- Particulares -->
  <div class="container-wide">
    <div class="svc" id="particulares" data-reveal="rise">
      <div class="svc__text">
        <p class="kicker" data-t="sec.res.badge"></p>
        <h3 class="d-3" data-t="sec.res.title"></h3>
        <p class="body-lg" data-t-html="sec.res.desc"></p>
        <a class="btn btn--dark" href="contacto.html">
          <span data-t="sec.res.link"></span>
          <svg aria-hidden="true"><use href="assets/icons/sprite.svg#arrow-right"></use></svg>
        </a>
      </div>
      <ul class="svc__list" data-stagger="70">
        <li data-reveal="rise-sm"><span class="svc__n num-tab">01</span><span><b data-t="sec.r1t"></b><i data-t="sec.r1d"></i></span></li>
        <li data-reveal="rise-sm"><span class="svc__n num-tab">02</span><span><b data-t="sec.r2t"></b><i data-t="sec.r2d"></i></span></li>
        <li data-reveal="rise-sm"><span class="svc__n num-tab">03</span><span><b data-t="sec.r3t"></b><i data-t="sec.r3d"></i></span></li>
        <li data-reveal="rise-sm"><span class="svc__n num-tab">04</span><span><b data-t="sec.r4t"></b><i data-t="sec.r4d"></i></span></li>
      </ul>
    </div>
  </div>
</section>

<!-- Inversores: bloque oscuro, para marcar el cambio de interlocutor -->
<section class="section-lg on-dark grain mapgrid" id="inversores" aria-labelledby="inv-h">
  <div class="container-wide">
    <div class="svc svc--rev" data-reveal="rise">
      <div class="svc__text">
        <p class="kicker" data-t="sec.inv.badge"></p>
        <h3 class="d-3" id="inv-h" data-t="sec.inv.title"></h3>
        <p class="body-lg" data-t-html="sec.inv.desc"></p>
        <a class="btn btn--primary" href="contacto.html">
          <span data-t="sec.inv.link"></span>
          <svg aria-hidden="true"><use href="assets/icons/sprite.svg#arrow-right"></use></svg>
        </a>
      </div>
      <ul class="svc__list" data-stagger="70">
        <li data-reveal="rise-sm"><span class="svc__n num-tab">01</span><span><b data-t="sec.i1t"></b><i data-t="sec.i1d"></i></span></li>
        <li data-reveal="rise-sm"><span class="svc__n num-tab">02</span><span><b data-t="sec.i2t"></b><i data-t="sec.i2d"></i></span></li>
        <li data-reveal="rise-sm"><span class="svc__n num-tab">03</span><span><b data-t="sec.i3t"></b><i data-t="sec.i3d"></i></span></li>
        <li data-reveal="rise-sm"><span class="svc__n num-tab">04</span><span><b data-t="sec.i4t"></b><i data-t="sec.i4d"></i></span></li>
      </ul>
    </div>
  </div>
</section>

<!-- ══ CIERRE ════════════════════════════════════════════════════════════ -->
<section class="section-lg" aria-labelledby="secfinal-h">
  <div class="container">
    <!-- Era una tarjeta blanca con un degradado tímido: el remate de la
         pagina se leia como un hueco con un boton. Panel de tinta, halo de
         oro detras del enunciado y la reticula de la marca al fondo. -->
    <div class="secfinal on-dark grain mapgrid" data-reveal="rise">
      <span class="secfinal__halo" aria-hidden="true"></span>
      <h2 class="d-2 center" id="secfinal-h" data-t="sec.final.title"></h2>
      <p class="secfinal__p" data-t="ui.final.p"></p>
      <a class="btn btn--primary btn--lg" href="contacto.html">
        <span data-t="sec.final.btn"></span>
        <svg aria-hidden="true"><use href="assets/icons/sprite.svg#arrow-right"></use></svg>
      </a>
      <!-- Sellos de cierre: las tres objeciones que quedan justo antes de
           pulsar, respondidas en una linea. -->
      <ul class="secfinal__sellos">
        <li><svg aria-hidden="true"><use href="assets/icons/sprite.svg#check-circle"></use></svg><span data-t="ui.final.m1"></span></li>
        <li><svg aria-hidden="true"><use href="assets/icons/sprite.svg#doc"></use></svg><span data-t="ui.final.m2"></span></li>
        <li><svg aria-hidden="true"><use href="assets/icons/sprite.svg#scale"></use></svg><span data-t="ui.final.m3"></span></li>
      </ul>
    </div>
  </div>
</section>
