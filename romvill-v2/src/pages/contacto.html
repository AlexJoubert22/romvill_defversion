<!-- ══ HERO ══════════════════════════════════════════════════════════════ -->
<section class="chero on-dark grain">
  <div class="chero__bg" aria-hidden="true"></div>

  <div class="container-wide chero__inner">
    <div class="chero__text">
      <p class="pill pill--gold" data-reveal="veil">
        <span class="pill__dot pill__dot--live"></span>
        <span data-t="contact.hero.tag"></span>
      </p>
      <h1 class="chero__h1">
        <span data-reveal="wipe" style="--reveal-delay:40ms" data-t="contact.hero.h1a"></span>
        <span class="chero__h1-accent" data-reveal="wipe" style="--reveal-delay:100ms" data-t="contact.hero.h1b"></span>
      </h1>
      <p class="chero__slogan" data-reveal="rise" style="--reveal-delay:150ms" data-t="contact.hero.slogan"></p>
      <p class="lead" data-reveal="rise" style="--reveal-delay:180ms" data-t="contact.hero.desc"></p>
      <div class="chero__cta" data-reveal="rise" style="--reveal-delay:220ms">
        <a class="btn btn--primary btn--lg" href="presupuesto-bloque-1.html">
          <span data-t="contact.hero.cta"></span>
          <svg aria-hidden="true"><use href="assets/icons/sprite.svg#arrow-right"></use></svg>
        </a>
        <p class="micro" data-t="contact.hero.ctasub"></p>
      </div>
    </div>

    <!-- Placa de cristal: la escena de pulso + los tres pasos -->
    <aside class="plate" data-reveal="scale-in" aria-label="{{t contact.step1.t}}">
      <div class="plate__scene" aria-hidden="true">
        <svg viewBox="0 0 320 120" preserveAspectRatio="none">
          <path class="plate__base" d="M0 84 C 46 84 60 34 96 34 S 150 78 186 60 S 244 20 268 20 L 320 20"/>
          <path class="plate__pulse" d="M0 84 C 46 84 60 34 96 34 S 150 78 186 60 S 244 20 268 20 L 320 20"/>
        </svg>
        <span class="plate__comet"></span>
      </div>

      <ol class="plate__steps" data-stagger="90">
        <li class="plate__step" data-reveal="rise-sm">
          <span class="plate__n num-tab">01</span>
          <span><b data-t="contact.step1.t"></b><i data-t="contact.step1.d"></i></span>
        </li>
        <li class="plate__step" data-reveal="rise-sm">
          <span class="plate__n num-tab">02</span>
          <span><b data-t="contact.step2.t"></b><i data-t="contact.step2.d"></i></span>
        </li>
        <li class="plate__step" data-reveal="rise-sm">
          <span class="plate__n num-tab">03</span>
          <span><b data-t="contact.step3.t"></b><i data-t="contact.step3.d"></i></span>
        </li>
      </ol>

      <p class="plate__cov">
        <svg aria-hidden="true"><use href="assets/icons/sprite.svg#pin"></use></svg>
        <span class="micro" data-t="contact.coverage"></span>
        <span class="plate__cities" data-t="hero.cities"></span>
      </p>
    </aside>
  </div>

  <!-- Tira de pilares de valor -->
  <div class="container-wide">
    <ul class="cvals" data-stagger="70">
      <li data-reveal="rise-sm">
        <svg aria-hidden="true"><use href="assets/icons/sprite.svg#scale"></use></svg>
        <span><b data-t="contact.val1.t"></b><i data-t="contact.val1.d"></i></span>
      </li>
      <li data-reveal="rise-sm">
        <svg aria-hidden="true"><use href="assets/icons/sprite.svg#target"></use></svg>
        <span><b data-t="contact.val2.t"></b><i data-t="contact.val2.d"></i></span>
      </li>
      <li data-reveal="rise-sm">
        <svg aria-hidden="true"><use href="assets/icons/sprite.svg#check-circle"></use></svg>
        <span><b data-t="contact.val3.t"></b><i data-t="contact.val3.d"></i></span>
      </li>
    </ul>
  </div>
</section>

<!-- ══ FORMULARIO + POR QUÉ ══════════════════════════════════════════════ -->
<section class="section-lg" aria-labelledby="form-h">
  <div class="container-wide">
    <p class="kicker" data-reveal="veil" data-t="cont.direct.badge"></p>

    <div class="cgrid">

      <!-- Formulario -->
      <div class="cform" data-reveal="rise">
        <h2 class="d-3" id="form-h" data-t="contact.title"></h2>

        <form class="cform__form" id="contact-form" novalidate>
          <div class="cform__row">
            <div class="field">
              <label class="field__label" for="f-nombre"><span data-t="contact.f.nombre"></span></label>
              <input class="field__input" type="text" id="f-nombre" name="nombre" autocomplete="given-name" required
                     data-t-attr="placeholder:contact.f.nombre.ph">
              <p class="field__err" data-err-for="f-nombre"></p>
            </div>
            <div class="field">
              <label class="field__label" for="f-apellido">
                <span data-t="contact.f.apellido"></span>
                <span class="field__opt" data-t="contact.f.opcional"></span>
              </label>
              <input class="field__input" type="text" id="f-apellido" name="apellido" autocomplete="family-name"
                     data-t-attr="placeholder:contact.f.apell.ph">
              <p class="field__err" data-err-for="f-apellido"></p>
            </div>
          </div>

          <div class="cform__row">
            <div class="field">
              <label class="field__label" for="f-email"><span data-t="contact.f.email"></span></label>
              <input class="field__input" type="email" id="f-email" name="email" autocomplete="email" required
                     data-t-attr="placeholder:contact.f.email.ph">
              <p class="field__err" data-err-for="f-email"></p>
            </div>
            <div class="field">
              <label class="field__label" for="f-telefono">
                <span data-t="contact.f.telefono"></span>
                <span class="field__opt" data-t="contact.f.opcional"></span>
              </label>
              <input class="field__input" type="tel" id="f-telefono" name="telefono" autocomplete="tel"
                     data-t-attr="placeholder:contact.f.tel.ph">
              <p class="field__err" data-err-for="f-telefono"></p>
            </div>
          </div>

          <div class="cform__row">
            <div class="field">
              <label class="field__label" for="f-zona"><span data-t="contact.f.zona"></span></label>
              <select class="field__select" id="f-zona" name="zona" required>
                <option value="" data-t="contact.f.zona.ph"></option>
                <option value="marbella" data-t="zona.marbella.nombre"></option>
                <option value="malaga"   data-t="zona.malaga.nombre"></option>
                <option value="alicante" data-t="zona.alicante.nombre"></option>
                <option value="otra"     data-t="contact.f.otzona"></option>
              </select>
              <p class="field__err" data-err-for="f-zona"></p>
            </div>
            <div class="field">
              <label class="field__label" for="f-objetivo"><span data-t="contact.f.objetivo"></span></label>
              <select class="field__select" id="f-objetivo" name="objetivo" required>
                <option value="" data-t="contact.f.obj.ph"></option>
                <option value="compra"    data-t="contact.f.obj.buy"></option>
                <option value="inversion" data-t="contact.f.obj.inv"></option>
                <option value="traslado"  data-t="contact.f.obj.rel"></option>
                <option value="otro"      data-t="contact.f.obj.oth"></option>
              </select>
              <p class="field__err" data-err-for="f-objetivo"></p>
            </div>
          </div>

          <div class="field">
            <label class="field__label" for="f-mensaje"><span data-t="contact.f.mensaje"></span></label>
            <textarea class="field__area" id="f-mensaje" name="mensaje" data-t-attr="placeholder:contact.f.msg.ph"></textarea>
          </div>

          <label class="check">
            <input type="checkbox" id="f-rgpd" name="rgpd" required>
            <span class="check__box" aria-hidden="true"><svg><use href="assets/icons/sprite.svg#check"></use></svg></span>
            <span class="check__text">
              <span data-t="contact.rgpd_checkbox"></span>
              <a class="link" href="privacidad.html" data-t="contact.rgpd_link"></a>.
            </span>
          </label>
          <p class="field__err" data-err-for="f-rgpd"></p>

          <button class="btn btn--primary btn--lg btn--block" type="submit" id="f-submit">
            <span data-t="contact.f.submit"></span>
            <svg aria-hidden="true"><use href="assets/icons/sprite.svg#arrow-right"></use></svg>
          </button>

          <p class="formstatus" id="f-status" role="status" aria-live="polite"></p>

          <p class="caption cform__legal">
            <svg class="ico" aria-hidden="true"><use href="assets/icons/sprite.svg#lock"></use></svg>
            <span data-t="contact.f.confidential"></span>
          </p>
          <p class="caption" data-t="contact.f.reassure"></p>
        </form>

        <p class="cform__reco">
          <span data-t="contact.form.recommend"></span>
          <a class="link" href="presupuesto-bloque-1.html" data-t="contact.form.recommend.link"></a>.
        </p>

        <div class="cform__channels">
          <p class="label" style="color:var(--accent)" data-t="contact.channels"></p>
          <a class="channel" href="mailto:info@romvill.com">
            <svg aria-hidden="true"><use href="assets/icons/sprite.svg#mail"></use></svg>
            <span><b data-t="contact.email.label"></b><i>info@romvill.com</i></span>
          </a>
          <a class="channel" href="agendar-llamada.html">
            <svg aria-hidden="true"><use href="assets/icons/sprite.svg#calendar"></use></svg>
            <span><b data-t="agenda.head"></b><i data-t="agenda.sub"></i></span>
          </a>
        </div>
      </div>

      <!-- Por qué Romvill -->
      <aside class="cwhy" data-reveal="rise">
        <h2 class="d-4" data-t="contact.why.title"></h2>

        <ul class="cwhy__list" data-stagger="60">
          <li data-reveal="rise-sm"><span class="cwhy__n num-tab">01</span><span><b data-t="contact.why.r1t"></b><i data-t="contact.why.r1d"></i></span></li>
          <li data-reveal="rise-sm"><span class="cwhy__n num-tab">02</span><span><b data-t="contact.why.r2t"></b><i data-t="contact.why.r2d"></i></span></li>
          <li data-reveal="rise-sm"><span class="cwhy__n num-tab">03</span><span><b data-t="contact.why.r3t"></b><i data-t="contact.why.r3d"></i></span></li>
          <li data-reveal="rise-sm"><span class="cwhy__n num-tab">04</span><span><b data-t="contact.why.r4t"></b><i data-t="contact.why.r4d"></i></span></li>
          <li data-reveal="rise-sm"><span class="cwhy__n num-tab">05</span><span><b data-t="contact.why.r5t"></b><i data-t="contact.why.r5d"></i></span></li>
          <li data-reveal="rise-sm"><span class="cwhy__n num-tab">06</span><span><b data-t="contact.why.r6t"></b><i data-t="contact.why.r6d"></i></span></li>
          <li data-reveal="rise-sm"><span class="cwhy__n num-tab">07</span><span><b data-t="contact.why.r7t"></b><i data-t="contact.why.r7d"></i></span></li>
          <li data-reveal="rise-sm"><span class="cwhy__n num-tab">08</span><span><b data-t="contact.why.r8t"></b><i data-t="contact.why.r8d"></i></span></li>
        </ul>

        <figure class="quote cwhy__quote" data-reveal="rise">
          <blockquote class="quote__text" data-t="contact.why.quote"></blockquote>
        </figure>
      </aside>

    </div>
  </div>
</section>

<!-- ══ NO SOMOS INMOBILIARIA ═════════════════════════════════════════════ -->
<section class="noinmo on-dark grain">
  <picture class="noinmo__media" aria-hidden="true">
    <source media="(max-width: 700px)" srcset="assets/images/sec/banus-noche-sm.webp" type="image/webp">
    <source srcset="assets/images/sec/banus-noche.webp" type="image/webp">
    <img src="assets/images/sec/banus-noche.jpg" alt="" width="1600" height="900"
         loading="lazy" decoding="async" data-parallax="0.06">
  </picture>
  <span class="noinmo__veil" aria-hidden="true"></span>

  <div class="container">
    <p class="noinmo__t" data-reveal="rise" data-t="contact.noinmo"></p>
  </div>
</section>
