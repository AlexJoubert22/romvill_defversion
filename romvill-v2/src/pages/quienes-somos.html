<!-- ══ BLOQUE 1 — el origen ══════════════════════════════════════════════
     Texto a la izquierda, litoral aéreo a la derecha: «nacimos sobre el
     terreno» pide ver el terreno. -->
<section class="section-lg" aria-labelledby="s1-h">
  <div class="container-wide">
    <div class="qsblock">
      <div class="qsblock__text" data-reveal="rise">
        <span class="prose__rule" aria-hidden="true"></span>
        <p class="kicker" data-t="ui.origen.kicker"></p>
        <h2 class="d-2" id="s1-h" data-t="qs.s1.title"></h2>
        <p class="body-lg" data-t="qs.s1.p1"></p>
        <p class="body-lg" data-t="qs.s1.p2"></p>

        <!-- Los cuatro campos de los que viene el equipo. El texto de arriba
             los nombra en prosa; aqui se leen de un vistazo, y de paso este
             bloque deja de ser gemelo del de abajo (texto + foto y ya). -->
        <ul class="origen">
          <li><svg aria-hidden="true"><use href="assets/icons/sprite.svg#shield"></use></svg><span data-t="ui.origen.c1"></span></li>
          <li><svg aria-hidden="true"><use href="assets/icons/sprite.svg#target"></use></svg><span data-t="ui.origen.c2"></span></li>
          <li><svg aria-hidden="true"><use href="assets/icons/sprite.svg#eye"></use></svg><span data-t="ui.origen.c3"></span></li>
          <li><svg aria-hidden="true"><use href="assets/icons/sprite.svg#layers"></use></svg><span data-t="ui.origen.c4"></span></li>
        </ul>
      </div>

      <figure class="qsfig" data-reveal="scale-in">
        <span class="qsfig__frame" data-parallax="0.05">
          <picture>
            <source media="(max-width: 700px)" srcset="assets/images/sec/proyeccion-sm.webp" type="image/webp">
            <source srcset="assets/images/sec/proyeccion.webp" type="image/webp">
            <img src="assets/images/sec/proyeccion.jpg" alt="" width="1600" height="900" loading="lazy" decoding="async">
          </picture>
          <!-- Esquinas de visor y coordenadas: la fotografia como documento
               de observacion, no como decoracion. El dato es geografico
               (posicion real del litoral), no copy. -->
          <span class="qsfig__esq" aria-hidden="true"></span>
          <span class="qsfig__geo micro" aria-hidden="true">36.49&#176; N &#183; 4.77&#176; O</span>
        </span>
      </figure>
    </div>
  </div>
</section>

<!-- ══ CITA CENTRAL ══════════════════════════════════════════════════════

    </figure>
  </div>
</section>

<!-- ══ BLOQUE 2 — analistas, no vendedores ══════════════════════════════
     Rediseñado entero. Antes era texto + fotografia, exactamente la misma
     silueta que el bloque de arriba: dos secciones consecutivas gemelas se
     leen como plantilla. Aqui la pieza es el CONTRASTE del que habla el
     texto —lo que NO somos frente a lo que SI—, compuesto como dos columnas
     enfrentadas sobre tinta. Sin fotografia: el argumento es conceptual, no
     territorial, y meter una vista de costa seria repetir por tercera vez
     el mismo recurso.
     ═════════════════════════════════════════════════════════════════════ -->
<section class="section-lg an on-dark grain" aria-labelledby="s2-h">
  <div class="container-wide">

    <div class="an__head" data-reveal="rise">
      <p class="kicker" data-t="ui.an.kicker"></p>
      <h2 class="d-2" id="s2-h" data-t="qs.s2.title"></h2>
    </div>

    <div class="an__grid">
      <!-- Columna NO: tachada, apagada, sin acento. -->
      <div class="an__col an__col--no" data-reveal="rise" data-stagger="80">
        <span class="an__lbl micro" aria-hidden="true">&#215;</span>
        <ul>
          <li data-reveal="rise-sm"><span data-t="ui.an.no1"></span></li>
          <li data-reveal="rise-sm"><span data-t="ui.an.no2"></span></li>
          <li data-reveal="rise-sm"><span data-t="ui.an.no3"></span></li>
        </ul>
      </div>

      <!-- Eje central: el filete que separa las dos lecturas. -->
      <span class="an__eje" aria-hidden="true"></span>

      <div class="an__col an__col--si" data-reveal="rise" data-stagger="80">
        <span class="an__lbl micro" aria-hidden="true">
          <svg><use href="assets/icons/sprite.svg#check"></use></svg>
        </span>
        <ul>
          <li data-reveal="rise-sm"><span data-t="ui.an.si1"></span></li>
          <li data-reveal="rise-sm"><span data-t="ui.an.si2"></span></li>
          <li data-reveal="rise-sm"><span data-t="ui.an.si3"></span></li>
        </ul>
      </div>
    </div>

    <div class="an__pie" data-reveal="rise">
      <div class="an__texto">
        <p class="body-lg" data-t="qs.s2.p1"></p>
        <p class="body-lg" data-t="qs.s2.p2"></p>
      </div>
      <a class="btn btn--outline" href="contacto.html">
        <span data-t="qs.midcta"></span>
        <svg aria-hidden="true"><use href="assets/icons/sprite.svg#arrow-right"></use></svg>
      </a>
    </div>

  </div>
</section>
