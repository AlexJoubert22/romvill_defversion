<!-- ══════════════════════════════════════════════════════════════════════
     EXPEDIENTE DE MUESTRA — la seccion que faltaba en la portada
     La web tiene una pagina entera de muestra real del informe y la portada
     no la enseñaba. Para una consultoria, el producto ES el documento:
     esta es la seccion mas importante que no existia. Izquierda, el texto
     del guion; derecha, el expediente compuesto como objeto — portada
     fotografica, sello de muestra y sus tres fuentes citadas. Todo el
     texto de la composicion sale del guion (mu.*, verif.*): nada inventado.
     ═════════════════════════════════════════════════════════════════════ -->
<section class="section-lg expo on-dark grain" aria-labelledby="expo-h">
  <div class="container-wide">
    <div class="expo__grid">

      <div class="expo__text" data-reveal="rise">
        <p class="kicker" data-t="mu.hero.kicker"></p>
        <h2 class="d-2" id="expo-h" data-t="mu.hero.title"></h2>
        <p class="lead" data-t="mu.hero.sub"></p>
        <a class="btn btn--primary" href="muestra-de-informe.html">
          <span data-t="mu.link.ver"></span>
          <svg aria-hidden="true"><use href="assets/icons/sprite.svg#arrow-right"></use></svg>
        </a>
        <!-- Aviso explicito: lo que se enseña aqui es una reduccion, y el
             informe real desarrolla cada dimension. Sin esto, el visitante
             puede pensar que las cinco barras y las tres fuentes SON el
             producto. -->
        <p class="expo__nota" data-t="ui.expo.nota"></p>
      </div>

      <!-- El expediente como objeto: dos hojas fantasma detras y el
           documento delante. Composicion CSS, sin maqueta de navegador. -->
      <div class="expo__doc" data-reveal="scale-in" aria-hidden="true">
        <span class="expo__hoja expo__hoja--b"></span>
        <span class="expo__hoja expo__hoja--a"></span>

        <div class="expo__front" data-parallax="0.04">
          <span class="expo__stamp micro" data-t="muestra.stamp"></span>

          <!-- Cabecera del expediente: rotulo, filete de oro y las dos
               cifras que lo describen. Nada de fotografia: un informe es un
               documento, y lo que lo hace creible es su estructura. -->
          <div class="expo__cab">
            <span class="expo__rule"></span>
            <span class="expo__doclbl micro" data-t="ui.expo.doc"></span>
          </div>

          <div class="expo__cifras">
            <span class="expo__cifra">
              <b class="num-tab">05</b>
              <i data-t="ui.expo.dims"></i>
            </span>
            <span class="expo__cifra">
              <b class="num-tab">03</b>
              <i data-t="ui.expo.src"></i>
            </span>
          </div>

          <!-- Barras de contenido: la silueta de un informe sin fingir texto
               que no existe. Cada bloque es una dimension. -->
          <div class="expo__lineas">
            <span class="expo__ln" style="--w:100%;--d:0ms"></span>
            <span class="expo__ln expo__ln--alt" style="--w:76%;--d:70ms"></span>
            <span class="expo__ln" style="--w:92%;--d:140ms"></span>
            <span class="expo__ln expo__ln--alt" style="--w:64%;--d:210ms"></span>
            <span class="expo__ln" style="--w:88%;--d:280ms"></span>
          </div>

          <ul class="expo__fuentes">
            <li><svg aria-hidden="true"><use href="assets/icons/sprite.svg#doc"></use></svg><span data-t="mu.cap.f1"></span><svg class="expo__ok" aria-hidden="true"><use href="assets/icons/sprite.svg#check"></use></svg></li>
            <li><svg aria-hidden="true"><use href="assets/icons/sprite.svg#doc"></use></svg><span data-t="mu.cap.f2"></span><svg class="expo__ok" aria-hidden="true"><use href="assets/icons/sprite.svg#check"></use></svg></li>
            <li><svg aria-hidden="true"><use href="assets/icons/sprite.svg#doc"></use></svg><span data-t="mu.cap.f3"></span><svg class="expo__ok" aria-hidden="true"><use href="assets/icons/sprite.svg#check"></use></svg></li>
          </ul>
        </div>
      </div>

    </div>
  </div>
</section>
