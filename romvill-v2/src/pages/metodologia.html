<!-- ══ INTERACTIVO: VERIFICACIÓN SOBRE EL TERRENO ════════════════════════ -->
<section class="section-lg" aria-labelledby="hs-h">
  <div class="container-wide">
    <div class="sec-head" data-reveal="rise">
      <p class="kicker" data-t="ix.hs.kicker"></p>
      <h2 class="d-2" id="hs-h" data-t="ix.hs.title"></h2>
      <p class="lead" data-t="ix.hs.help"></p>
    </div>

    <!-- ── Registro de campo ───────────────────────────────────────────────
         Antes esto eran cinco puntos pulsantes sobre una foto de atardecer.
         El problema no era la interaccion: era que en esa foto NO HAY NADA a
         lo que apuntar —los puntos caian sobre cielo y mar— y el panel de al
         lado estaba vacio hasta que alguien pulsaba. Mucho gesto para poco
         contenido.

         Ahora las cinco comprobaciones se ven TODAS a la vez, y cada una
         tiene su fotografia real de esa misma comprobacion en este mismo
         territorio: Nueva Andalucia para seguridad, la Explanada de Alicante
         para demografia, el Hospital Regional de Malaga para sanidad, la
         autopista de Elche de noche para movilidad y el litoral entre
         Marbella y Fuengirola para desarrollo. La lista informa sola; la
         imagen es la recompensa de recorrerla. -->
    <div class="field" id="field" data-reveal="rise">
      <div class="field__media">
        <picture class="field__shot" data-f-shot="seg" data-on>
          <source srcset="assets/images/sec/seguridad-sm.webp" type="image/webp">
          <img src="assets/images/sec/seguridad.jpg" alt="" width="800" height="450" loading="lazy" decoding="async">
        </picture>
        <picture class="field__shot" data-f-shot="dem">
          <source srcset="assets/images/sec/demografico-sm.webp" type="image/webp">
          <img src="assets/images/sec/demografico.jpg" alt="" width="800" height="450" loading="lazy" decoding="async">
        </picture>
        <picture class="field__shot" data-f-shot="san">
          <source srcset="assets/images/sec/sanidad-sm.webp" type="image/webp">
          <img src="assets/images/sec/sanidad.jpg" alt="" width="800" height="450" loading="lazy" decoding="async">
        </picture>
        <picture class="field__shot" data-f-shot="mov">
          <source srcset="assets/images/sec/movilidad-sm.webp" type="image/webp">
          <img src="assets/images/sec/movilidad.jpg" alt="" width="800" height="450" loading="lazy" decoding="async">
        </picture>
        <picture class="field__shot" data-f-shot="dev">
          <source srcset="assets/images/sec/proyeccion-sm.webp" type="image/webp">
          <img src="assets/images/sec/proyeccion.jpg" alt="" width="800" height="450" loading="lazy" decoding="async">
        </picture>
        <span class="field__veil" aria-hidden="true"></span>
        <p class="field__stamp micro" data-f-stamp>01 / 05</p>
      </div>

      <div class="field__col">
      <p class="field__hint micro" data-t="ix.hs.hint"></p>
      <ul class="field__list" data-stagger="60">
        <li>
          <button class="fitem" type="button" data-f="seg" aria-pressed="true">
            <span class="fitem__n num-tab">01</span>
            <span class="fitem__ico" aria-hidden="true"><svg><use href="assets/icons/sprite.svg#shield"></use></svg></span>
            <span class="fitem__body">
              <b data-t="ix.hs.seg.t"></b>
              <i data-t="ix.hs.seg.d"></i>
            </span>
          </button>
        </li>
        <li>
          <button class="fitem" type="button" data-f="dem" aria-pressed="false">
            <span class="fitem__n num-tab">02</span>
            <span class="fitem__ico" aria-hidden="true"><svg><use href="assets/icons/sprite.svg#users"></use></svg></span>
            <span class="fitem__body">
              <b data-t="ix.hs.dem.t"></b>
              <i data-t="ix.hs.dem.d"></i>
            </span>
          </button>
        </li>
        <li>
          <button class="fitem" type="button" data-f="san" aria-pressed="false">
            <span class="fitem__n num-tab">03</span>
            <span class="fitem__ico" aria-hidden="true"><svg><use href="assets/icons/sprite.svg#health"></use></svg></span>
            <span class="fitem__body">
              <b data-t="ix.hs.san.t"></b>
              <i data-t="ix.hs.san.d"></i>
            </span>
          </button>
        </li>
        <li>
          <button class="fitem" type="button" data-f="mov" aria-pressed="false">
            <span class="fitem__n num-tab">04</span>
            <span class="fitem__ico" aria-hidden="true"><svg><use href="assets/icons/sprite.svg#route"></use></svg></span>
            <span class="fitem__body">
              <b data-t="ix.hs.mov.t"></b>
              <i data-t="ix.hs.mov.d"></i>
            </span>
          </button>
        </li>
        <li>
          <button class="fitem" type="button" data-f="dev" aria-pressed="false">
            <span class="fitem__n num-tab">05</span>
            <span class="fitem__ico" aria-hidden="true"><svg><use href="assets/icons/sprite.svg#growth"></use></svg></span>
            <span class="fitem__body">
              <b data-t="ix.hs.dev.t"></b>
              <i data-t="ix.hs.dev.d"></i>
            </span>
          </button>
        </li>
      </ul>
      </div>
    </div>

    <!-- ── El metodo, en una linea ─────────────────────────────────────────
         Parrafo pedido por el cliente (capa v2, ui.*: el guion oficial no se
         toca) y el proceso en tres pasos. Los tres nodos van unidos por un
         filete que se dibuja al entrar: gabinete -> terreno -> contraste. -->
    <div class="proceso" data-reveal="rise">
      <p class="proceso__p body-lg" data-t="ui.field.p"></p>

      <ol class="proceso__pasos" data-stagger="90">
        <li class="paso" data-reveal="rise-sm">
          <span class="paso__ico" aria-hidden="true"><svg><use href="assets/icons/sprite.svg#search"></use></svg></span>
          <span class="paso__n num-tab">01</span>
          <b data-t="ui.field.s1"></b>
          <i data-t="ui.field.s1d"></i>
        </li>
        <li class="paso" data-reveal="rise-sm">
          <span class="paso__ico" aria-hidden="true"><svg><use href="assets/icons/sprite.svg#pin"></use></svg></span>
          <span class="paso__n num-tab">02</span>
          <b data-t="ui.field.s2"></b>
          <i data-t="ui.field.s2d"></i>
        </li>
        <li class="paso" data-reveal="rise-sm">
          <span class="paso__ico" aria-hidden="true"><svg><use href="assets/icons/sprite.svg#check-circle"></use></svg></span>
          <span class="paso__n num-tab">03</span>
          <b data-t="ui.field.s3"></b>
          <i data-t="ui.field.s3d"></i>
        </li>
      </ol>
    </div>
  </div>
</section>

<!-- ══ DECLARACIÓN DE USO DE IA (AI Act art. 50) ═════════════════════════ -->
<section class="section section--alt" aria-labelledby="ia-h">
  <div class="container">
    <!-- Antes: un recuadro solitario con un icono y dos parrafos. Ahora el
         texto va a la izquierda y a la derecha el DIAGRAMA de lo que dice:
         tres capas —fuentes, herramientas de IA, criterio humano— donde la
         de abajo, la humana, es la que firma. Es la ilustracion literal de
         los dos parrafos, no decoracion. Las etiquetas son capa v2 (ui.*). -->
    <div class="ia" data-reveal="rise">
      <div class="ia__body">
        <p class="kicker" data-t="met.ia.kicker"></p>
        <h2 class="d-3" id="ia-h" data-t="met.ia.title"></h2>
        <p class="body-lg" data-t-html="met.ia.p1"></p>
        <p class="body-lg" data-t-html="met.ia.p2"></p>
      </div>

      <div class="ia__capas" aria-hidden="true" data-stagger="120">
        <div class="capa" data-reveal="rise-sm">
          <span class="capa__ico"><svg><use href="assets/icons/sprite.svg#doc"></use></svg></span>
          <span class="capa__t"><b data-t="ui.ia.l1"></b><i data-t="ui.ia.l1d"></i></span>
        </div>
        <span class="capa__flujo"></span>
        <div class="capa" data-reveal="rise-sm">
          <span class="capa__ico"><svg><use href="assets/icons/sprite.svg#sparkle"></use></svg></span>
          <span class="capa__t"><b data-t="ui.ia.l2"></b><i data-t="ui.ia.l2d"></i></span>
        </div>
        <span class="capa__flujo"></span>
        <div class="capa capa--firma" data-reveal="rise-sm">
          <span class="capa__ico"><svg><use href="assets/icons/sprite.svg#eye"></use></svg></span>
          <span class="capa__t"><b data-t="ui.ia.l3"></b><i data-t="ui.ia.l3d"></i></span>
          <svg class="capa__ok"><use href="assets/icons/sprite.svg#check-circle"></use></svg>
        </div>
      </div>
    </div>
  </div>
</section>
