<!-- ══ CABECERA + BUSCADOR ═══════════════════════════════════════════════ -->
<section class="phero phero--center phero--photo phero--banda on-dark grain">
  <picture class="phero__media" aria-hidden="true">
    <source media="(max-width: 700px)" srcset="assets/images/sec/banus-dusk-sm.webp" type="image/webp">
    <source srcset="assets/images/sec/banus-dusk.webp" type="image/webp">
    <img src="assets/images/sec/banus-dusk.jpg" alt="" width="1600" height="360"
         fetchpriority="high" decoding="async" data-parallax="0.04">
  </picture>
  <span class="phero__veil" aria-hidden="true"></span>

  <div class="container">
    <div class="phero__inner">
      <p class="kicker kicker--center" data-reveal="veil" data-t="faq.hero.kicker"></p>
      <h1 class="d-1" data-reveal="wipe" style="--reveal-delay:40ms" data-t="faq.hero.title"></h1>
      <p class="lead" data-reveal="rise" style="--reveal-delay:100ms" data-t="faq.hero.sub"></p>

      <form class="faqsearch" role="search" data-reveal="rise" style="--reveal-delay:140ms" onsubmit="return false">
        <svg class="faqsearch__ico" aria-hidden="true"><use href="assets/icons/sprite.svg#search"></use></svg>
        <label class="visually-hidden" for="faq-q" data-t="faq.search.ph"></label>
        <input class="faqsearch__input" type="search" id="faq-q" autocomplete="off"
               data-t-attr="placeholder:faq.search.ph">
        <button class="faqsearch__clear" type="button" id="faq-clear" hidden data-t-attr="aria-label:ui.close">
          <svg aria-hidden="true"><use href="assets/icons/sprite.svg#close"></use></svg>
        </button>
      </form>
    </div>
  </div>
</section>

<!-- ══ PREGUNTAS ═════════════════════════════════════════════════════════ -->
<section class="section" aria-labelledby="faq-h">
  <div class="container-text">
    <h2 class="visually-hidden" id="faq-h" data-t="faq.hero.title"></h2>

    <p class="faq__noresult" id="faq-noresult" role="status" aria-live="polite" hidden
       data-t-html="faq.noresult"></p>

    <div class="faq" id="faq">
{{faq}}
    </div>
  </div>
</section>

{{> cta-block}}
