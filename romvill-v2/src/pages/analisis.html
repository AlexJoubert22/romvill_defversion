<!-- ══ HERO ══════════════════════════════════════════════════════════════ -->
<section class="phero on-dark grain mapgrid">
  <div class="container">
    <div class="phero__inner">
      <p class="kicker" data-reveal="veil" data-t="ana.badge"></p>
      <h1 class="d-1" data-reveal="wipe" style="--reveal-delay:40ms" data-t-html="ana.title"></h1>
      <p class="lead" data-reveal="rise" style="--reveal-delay:100ms" data-t="ana.desc"></p>
    </div>
  </div>
</section>

         v2, ui.*: el guion oficial no tiene claves para esta seccion). -->

        </div>
        <h3 class="d-4" data-t="ana.d1.title"></h3>
        <p class="body" data-t="ana.d1.desc"></p>
        <ul class="ticks">
          <li><svg aria-hidden="true"><use href="assets/icons/sprite.svg#check"></use></svg><span data-t="ana.d1.i1"></span></li>

      <article class="dim card--glow" data-reveal="rise">

      <!-- La quinta dimension. El guion la trata como perfil aparte

           dos de sus capitulos como items. Va a lo ancho porque cinco
           tarjetas en reticula de dos dejan un hueco, y porque la proyeccion
           es la dimension-sintesis: cierra la serie. -->
      <article class="dim dim--wide card--glow" data-reveal="rise">
        <div class="dim__head">
          <span class="dim__ico" aria-hidden="true"><svg><use href="assets/icons/sprite.svg#growth"></use></svg></span>
          <span class="dim__meta"><span class="micro" data-t="ana.dim"></span><span class="dim__num num-tab">05</span></span>

<!-- ══════════════════════════════════════════════════════════════════════
     LO QUE SE VE · LO QUE SABEMOS
     La tesis de la marca convertida en interacción: a la izquierda la
     fachada; a la derecha, lo que hay detrás del dato.
     ═════════════════════════════════════════════════════════════════════ -->
<section class="section-lg reveal-sec on-dark grain" aria-label="{{t ix.sl.title}}">
  <div class="container-wide">
    <div class="sec-head" data-reveal="rise">
      <p class="kicker" data-t="ix.sl.kicker"></p>
      <!-- El titular se compone de sus dos mitades, que ya existen como
           claves propias (son los rotulos de las columnas). Asi se puede
           teñir la segunda sin tocar el diccionario: `ix.sl.title` seguiria
           siendo un unico nodo de texto y no admite color parcial.
           El titulo completo se conserva como nombre accesible de la
           seccion, que es donde importa que la frase vaya entera. -->
      <h2 class="d-2 cmp__h" id="sl-h">
        <span class="cmp__h-ve" data-t="ix.sl.left"></span>
        <span class="cmp__h-sep" aria-hidden="true">&#183;</span>
        <span class="cmp__h-sabe" data-t="ix.sl.right"></span>
      </h2>
      <p class="lead" data-t="ui.cmp.lead"></p>
      <!-- `ix.sl.help` decia «Pasa el raton sobre la imagen; el control se
           mueve solo». Era la instruccion del deslizante que ya no existe:
           mantenerla seria pedir al visitante que haga algo imposible. Es
           chrome de interaccion, no argumento de venta, asi que se retira
           con la interaccion. Ninguna frase del guion comercial se toca. -->
    </div>

    <!-- ── Tabla comparativa ───────────────────────────────────────────────
         Sustituye al deslizante de foto. La idea de fondo no cambia —lo que
         se ve frente a lo que sabemos— pero deja de depender de una imagen
         que hay que arrastrar para entender.

         La columna central NO lleva texto porque no hay texto que poner: el
         punto es justamente que a simple vista NO SE SABE. Se dibuja como
         informacion tapada. Es un recurso grafico, no una afirmacion: no
         dice nada falso sobre la zona, dice «aqui no tienes el dato».      -->
    <div class="cmp" data-stagger="80">
      <div class="cmp__cab" aria-hidden="true">
        <span></span>
        <span class="cmp__cab-ve" data-t="ix.sl.left"></span>
        <span class="cmp__cab-sabe" data-t="ix.sl.right"></span>
      </div>

        <div class="cmp__fila" data-reveal="rise-sm">
          <div class="cmp__dim">
            <span class="cmp__ico" aria-hidden="true"><svg><use href="assets/icons/sprite.svg#shield"></use></svg></span>
            <span class="cmp__n num-tab">01</span>
            <b data-t="ix.sl.seg.t"></b>
          </div>

          <div class="cmp__ciego" aria-hidden="true">
            <span class="cmp__tapa" style="--w:82%"></span>
            <span class="cmp__tapa" style="--w:64%"></span>
            <span class="cmp__tapa" style="--w:71%"></span>
          </div>

          <div class="cmp__saber">
            <svg class="cmp__ok" aria-hidden="true"><use href="assets/icons/sprite.svg#check-circle"></use></svg>
            <i data-t="ix.sl.seg.d"></i>
          </div>
        </div>
        <div class="cmp__fila" data-reveal="rise-sm">
          <div class="cmp__dim">
            <span class="cmp__ico" aria-hidden="true"><svg><use href="assets/icons/sprite.svg#users"></use></svg></span>
            <span class="cmp__n num-tab">02</span>
            <b data-t="ix.sl.dem.t"></b>
          </div>

          <div class="cmp__ciego" aria-hidden="true">
            <span class="cmp__tapa" style="--w:82%"></span>
            <span class="cmp__tapa" style="--w:64%"></span>
            <span class="cmp__tapa" style="--w:71%"></span>
          </div>

          <div class="cmp__saber">
            <svg class="cmp__ok" aria-hidden="true"><use href="assets/icons/sprite.svg#check-circle"></use></svg>
            <i data-t="ix.sl.dem.d"></i>
          </div>
        </div>
        <div class="cmp__fila" data-reveal="rise-sm">
          <div class="cmp__dim">
            <span class="cmp__ico" aria-hidden="true"><svg><use href="assets/icons/sprite.svg#health"></use></svg></span>
            <span class="cmp__n num-tab">03</span>
            <b data-t="ix.sl.san.t"></b>
          </div>

          <div class="cmp__ciego" aria-hidden="true">
            <span class="cmp__tapa" style="--w:82%"></span>
