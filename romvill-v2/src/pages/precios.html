<!-- ══ CABECERA ══════════════════════════════════════════════════════════ -->
<section class="phero phero--center phero--photo on-dark grain">
  <picture class="phero__media" aria-hidden="true">
    <source media="(max-width: 700px)" srcset="assets/images/sec/malaga-azul-sm.webp" type="image/webp">
    <source srcset="assets/images/sec/malaga-azul.webp" type="image/webp">
    <img src="assets/images/sec/malaga-azul.jpg" alt="" width="1600" height="900"
         fetchpriority="high" decoding="async" data-parallax="0.05">
  </picture>
  <span class="phero__veil" aria-hidden="true"></span>

  <div class="container">
    <div class="phero__inner">
      <p class="kicker kicker--center" data-reveal="veil" data-t="precios.kicker"></p>
      <h1 class="d-1" data-reveal="wipe" style="--reveal-delay:40ms" data-t="precios.title"></h1>
      <p class="lead" data-reveal="rise" style="--reveal-delay:100ms" data-t="precios.subtitle"></p>

      <!-- Programa Inaugural: mientras quedan plazas es la única oferta visible.
           Los importes salen de inc/estimacion.php (ROMVILL_LANZ_*). -->
      <p class="pill pill--solid" data-reveal="rise" style="--reveal-delay:140ms">
        <span class="pill__dot pill__dot--live" style="background:#0a0f18"></span>
        {{tf inaug.badge|5|5}}
      </p>
      <p class="caption center" data-reveal="rise" style="--reveal-delay:170ms" data-t="inaug.zonas"></p>
      <p class="caption center" data-t="inaug.plazo"></p>
    </div>
  </div>
</section>

<!-- ══ LOS TRES NIVELES ══════════════════════════════════════════════════ -->
<section class="section" aria-labelledby="plans-h">
  <div class="container">
    <h2 class="visually-hidden" id="plans-h" data-t="precios.title"></h2>

    <div class="plans" data-stagger="90">

      <!-- Esencial -->
      <article class="plan" data-reveal="rise">
        <div class="plan__top">
          <h3 class="plan__name" data-t="precios.expres.name"></h3>
          <p class="plan__desc" data-t="precios.expres.desc"></p>
        </div>
        <p class="pill pill--gold plan__launch" data-t="precios.launch.badge"></p>
        <div class="plan__price">
          <span class="plan__amount num-tab">149&nbsp;€</span>
          <span class="plan__was num-tab">290&nbsp;€</span>
        </div>
        <p class="plan__note" data-t="precios.launch.note"></p>
        <hr class="hairline">
        <ul class="ticks plan__feats" data-t-list="precios.expres.feat"></ul>
        <p class="plan__delivery"><span data-t="precios.delivery"></span>: <span data-t="precios.expres.delivery"></span></p>
        <a class="btn btn--outline btn--block" href="contacto.html" data-t="precios.cta"></a>
      </article>

      <!-- Superior (recomendado) -->
      <article class="plan plan--featured" data-reveal="rise">
        <span class="pill pill--solid plan__flag" data-t="precios.recommended"></span>
        <div class="plan__top">
          <h3 class="plan__name" data-t="precios.analisis.name"></h3>
          <p class="plan__desc" data-t="precios.analisis.desc"></p>
        </div>
        <p class="pill pill--gold plan__launch" data-t="precios.launch.badge"></p>
        <div class="plan__price">
          <span class="plan__amount num-tab">249&nbsp;€</span>
          <span class="plan__was num-tab">349&nbsp;€</span>
        </div>
        <p class="plan__note" data-t="precios.launch.note"></p>
        <hr class="hairline">
        <ul class="ticks plan__feats" data-t-list="precios.analisis.feat"></ul>
        <p class="plan__delivery"><span data-t="precios.delivery"></span>: <span data-t="precios.analisis.delivery"></span></p>
        <a class="btn btn--primary btn--block" href="contacto.html" data-t="precios.cta"></a>
      </article>

      <!-- Premium — nunca lleva descuento -->
      <article class="plan" data-reveal="rise">
        <div class="plan__top">
          <h3 class="plan__name" data-t="precios.premium.name"></h3>
          <p class="plan__desc" data-t="precios.premium.desc"></p>
        </div>
        <p class="micro plan__official" data-t="precios.official"></p>
        <div class="plan__price">
          <span class="plan__amount num-tab">890&nbsp;€</span>
        </div>
        <p class="plan__note"><span data-t="precios.from"></span></p>
        <hr class="hairline">
        <ul class="ticks plan__feats" data-t-list="precios.premium.feat"></ul>
        <p class="plan__delivery"><span data-t="precios.delivery"></span>: <span data-t="precios.premium.delivery"></span></p>
        <a class="btn btn--outline btn--block" href="contacto.html" data-t="precios.cta"></a>
      </article>

    </div>

    <div class="center" style="margin-top:var(--sp-12)" data-reveal="rise">
      <a class="btn btn--ghost" href="muestra-de-informe.html">
        <svg aria-hidden="true"><use href="assets/icons/sprite.svg#doc"></use></svg>
        <span data-t="mu.link.ver"></span>
      </a>
    </div>
  </div>
</section>

<!-- ══ SUPLEMENTOS Y GARANTÍA ════════════════════════════════════════════ -->
<section class="section-lg" aria-labelledby="sup-h">
  <div class="container">
    <div class="extras">

      <div class="extras__col" data-reveal="rise">
        <h2 class="d-4" id="sup-h" data-t="precios.sup.title"></h2>
        <p class="extras__intro" data-t="ui.sup.p"></p>
        <ul class="ticks" data-t-list="precios.sup.items"></ul>
        <p class="caption" data-t="precios.sup.note"></p>

        <!-- ── Alcance: base frente a suplementos ────────────────────────
             Grafica de barras apiladas, una por nivel. El tramo solido es
             lo que YA cubre el informe base y el punteado lo que anaden
             los suplementos: la nota dice «los informes se amplian, nunca
             se recortan» y esto lo enseña. Las proporciones son de alcance
             relativo entre niveles —no cifras de negocio— y por eso van
             sin numero: dibujar un eje con valores seria inventar dato. -->
        <div class="alcance" data-reveal="rise" data-stagger="90">
          <div class="alcance__fila" data-reveal="rise-sm">
            <span class="alcance__lbl" data-t="precios.expres.name"></span>
            <span class="alcance__barra"><span class="alcance__base" style="--w:58%"></span><span class="alcance__ext" style="--w:22%"></span></span>
          </div>
          <div class="alcance__fila" data-reveal="rise-sm">
            <span class="alcance__lbl" data-t="precios.analisis.name"></span>
            <span class="alcance__barra"><span class="alcance__base" style="--w:76%"></span><span class="alcance__ext" style="--w:18%"></span></span>
          </div>
          <div class="alcance__fila" data-reveal="rise-sm">
            <span class="alcance__lbl" data-t="precios.premium.name"></span>
            <span class="alcance__barra"><span class="alcance__base" style="--w:92%"></span><span class="alcance__ext" style="--w:8%"></span></span>
          </div>

          <div class="alcance__leyenda">
            <span><i class="alcance__sw alcance__sw--base"></i><span data-t="ui.sup.base"></span></span>
            <span><i class="alcance__sw alcance__sw--ext"></i><span data-t="ui.sup.extra"></span></span>
          </div>
        </div>
      </div>

      <div class="extras__col extras__col--credit" data-reveal="rise">
        <span class="extras__ico" aria-hidden="true"><svg><use href="assets/icons/sprite.svg#scale"></use></svg></span>
        <h2 class="d-4" data-t="precios.credit.title"></h2>
        <p class="body" data-t="precios.credit.desc"></p>
      </div>

    </div>
  </div>
</section>
