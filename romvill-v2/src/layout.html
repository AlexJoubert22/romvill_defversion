<!doctype html>
<html lang="es" data-base="" class="{{@bodyClass}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{@pageTitle}}</title>
<meta name="description" content="{{@pageDesc}}">
<link rel="canonical" href="https://romvill.com/{{@slug}}/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="ROMVILL">
<meta property="og:locale" content="es_ES">
<meta property="og:title" content="{{@pageTitle}}">
<meta property="og:description" content="{{@pageDesc}}">
<meta property="og:url" content="https://romvill.com/{{@slug}}/">
<meta property="og:image" content="https://romvill.com/assets/images/{{@og}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{@pageTitle}}">
<meta name="twitter:description" content="{{@pageDesc}}">
<meta name="twitter:image" content="https://romvill.com/assets/images/{{@og}}">
<meta name="theme-color" content="#0a0f18" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f8f9fc" media="(prefers-color-scheme: light)">

<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/f06.woff2" as="font" type="font/woff2" crossorigin>

<script>
/* Tema antes del primer pintado — evita el parpadeo.
   Se conserva la regla del tema original: sin preferencia guardada, oscuro
   entre las 20:00 y las 07:00. */
/* Marca de JavaScript activo. Todo lo que se oculta para animarse va
   condicionado a .js, de modo que sin JavaScript la web se ve entera. */
document.documentElement.classList.add('js');
(function () {
  try {
    var t = localStorage.getItem('romvill_theme');
    if (!t) { var h = new Date().getHours(); t = (h >= 20 || h < 7) ? 'dark' : 'light'; }
    if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
})();
</script>

{{@schema}}

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/legacy-copy.css">{{@pageCss}}
</head>

<body>

<div class="progressbar" id="progressbar" aria-hidden="true"></div>

{{> nav}}

<main id="main">
{{content}}
</main>

{{> footer}}

{{> cookies}}

<script type="module" src="assets/js/app.js"></script>{{@pageJs}}
</body>
</html>
